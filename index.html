<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tutor Inglés BHP</title>
  <meta name="description" content="Tutor de inglés para reuniones en BHP: simulación de reuniones con acento australiano e indio, gramática avanzada y pronunciación." />
  <meta name="theme-color" content="#e65c00" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <h1>Tutor Inglés <span class="brand">BHP</span></h1>
    <button id="btn-settings" class="icon-btn" aria-label="Ajustes">⚙️</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" role="tablist">
    <button data-tab="meeting" class="active"><span>🗣️</span>Reunión</button>
    <button data-tab="grammar"><span>📘</span>Gramática</button>
    <button data-tab="pron"><span>🎙️</span>Pronunciación</button>
    <button data-tab="progress"><span>📈</span>Progreso</button>
  </nav>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings">
      <h2>Ajustes</h2>
      <label>API key de Anthropic
        <input id="set-key" type="password" autocomplete="off" placeholder="sk-ant-..." />
        <small>Se guarda solo en este teléfono. Créala en console.anthropic.com → API keys.</small>
      </label>
      <label>Modelo
        <select id="set-model"></select>
        <small>Opus responde mejor; Haiku cuesta ~40 veces menos.</small>
      </label>
      <label>Tu nombre en las transcripciones (opcional)
        <input id="set-name" type="text" placeholder="p. ej. Andrea Sandoval" />
      </label>
      <label>Idioma del reconocimiento de voz
        <select id="set-recog">
          <option value="en-AU">Inglés (Australia)</option>
          <option value="en-US">Inglés (EE.UU.)</option>
          <option value="en-GB">Inglés (Reino Unido)</option>
          <option value="en-IN">Inglés (India)</option>
        </select>
      </label>
      <label>Velocidad de la voz: <output id="rate-out"></output>
        <input id="set-rate" type="range" min="0.6" max="1.3" step="0.05" />
      </label>
      <label class="check"><input id="set-hide" type="checkbox" /> Modo escucha: ocultar el texto del personaje (toca para verlo)</label>
      <fieldset>
        <legend>Voces naturales</legend>
        <label>Proveedor
          <select id="set-provider">
            <option value="azure">Microsoft Azure (más simple de configurar)</option>
            <option value="google">Google Cloud</option>
          </select>
        </label>
        <div id="prov-azure">
          <label>Clave de Azure Speech (KEY 1)
            <input id="set-akey" type="password" autocomplete="off" placeholder="Clave de 32 o más caracteres" />
          </label>
          <label>Región de Azure
            <input id="set-aregion" type="text" autocomplete="off" placeholder="p. ej. eastus, brazilsouth, australiaeast" />
          </label>
        </div>
        <div id="prov-google">
          <label>API key de Google Cloud
            <input id="set-gkey" type="password" autocomplete="off" placeholder="AIza..." />
          </label>
        </div>
        <label class="check"><input id="set-cloud" type="checkbox" /> Usar voces naturales</label>
        <label>Límite mensual de caracteres
          <input id="set-ttslimit" type="number" min="0" step="50000" />
          <small id="tts-usage"></small>
        </label>
        <button type="button" id="test-cloud" class="secondary">🔊 Probar voces naturales</button>
        <small id="test-cloud-out"></small>
      </fieldset>
      <fieldset>
        <legend>Voces del celular (respaldo)</legend>
        <label>Australiana <select id="set-voice-au"></select></label>
        <label>India <select id="set-voice-in"></select></label>
        <small>Si no aparecen voces de Australia o India: Ajustes de Android → Accesibilidad / Idioma → Salida de texto a voz → Google → Instalar datos de voz → English (Australia) e English (India).</small>
      </fieldset>
      <menu>
        <button value="cancel" class="secondary">Cerrar</button>
        <button id="set-save" value="save" class="primary">Guardar</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
